name: ESLint

on:
  push:
    branches: *
  pull_request:
    branches: *

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ESLint
        run:  npm install eslint@10.10.0

      - name: Run ESLint
        run: npx eslint .
          --config .eslintrc.js